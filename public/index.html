<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jewishtory · Histoires du soir</title>
<meta name="description" content="Une histoire du soir pour chaque paracha, en français avec des mots d'hébreu, à écouter avec les enfants.">
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<meta property="og:title" content="Jewishtory · Histoires du soir">
<meta property="og:image" content="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#26224a">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Varela+Round&family=Rubik:wght@500&display=swap">
<style>
/* Layout: one narrow column like a night-light card. Header with the story picker, then this week's story:
   illustration, title, player (sticky), cast, and the text that follows the voice. */
:root{
  --bg:#f3f0fa; --surface:#ffffff; --ink:#26224a; --muted:#6c6890;
  --accent:#e38b2c; --accent-ink:#ffffff; --line:#ddd8ee;
  --hl:#fff1dc; --chip:#efeaff; --shadow:0 1px 2px rgba(38,34,74,.06),0 8px 24px rgba(38,34,74,.08);
  --v-N:#6b5fb5; --v-NOAH:#2f5d8a; --v-AVRAM:#8a4b2f; --v-SARAI:#2f7f8a; --v-AVRAHAM:#8a4b2f; --v-SARAH:#2f7f8a; --v-MALAKH:#9a7a12; --v-EYDEL:#c2477a; --v-ARIE:#2f8a63; --v-HILLEL:#c27a12;
  --f-display:"Fraunces", Georgia, serif; --f-body:"Varela Round","Rubik",system-ui,sans-serif; --f-he:"Rubik","Arial Hebrew",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141230; --surface:#1e1b42; --ink:#ece9ff; --muted:#a9a4d0; --accent:#f2a54a; --accent-ink:#1b1430;
  --line:#332f63; --hl:#3a2f2a; --chip:#2a2660; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --v-N:#b3a8ff; --v-NOAH:#86b9ec; --v-AVRAM:#e5a383; --v-SARAI:#7fd3dd; --v-AVRAHAM:#e5a383; --v-SARAH:#7fd3dd; --v-MALAKH:#f0d77a; --v-EYDEL:#f08bb4; --v-ARIE:#79d1a8; --v-HILLEL:#f2c06b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141230; --surface:#1e1b42; --ink:#ece9ff; --muted:#a9a4d0; --accent:#f2a54a; --accent-ink:#1b1430;
  --line:#332f63; --hl:#3a2f2a; --chip:#2a2660; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --v-N:#b3a8ff; --v-NOAH:#86b9ec; --v-AVRAM:#e5a383; --v-SARAI:#7fd3dd; --v-AVRAHAM:#e5a383; --v-SARAH:#7fd3dd; --v-MALAKH:#f0d77a; --v-EYDEL:#f08bb4; --v-ARIE:#79d1a8; --v-HILLEL:#f2c06b; color-scheme:dark}
:root{--v-YITSHAK:var(--v-AVRAM);--v-YAAKOV:var(--v-NOAH);--v-MOSHE:var(--v-NOAH);--v-YOSSEF:var(--v-MALAKH);--v-RIVKA:var(--v-SARAI);--v-RAHEL:var(--v-SARAI);--v-MIRIAM:var(--v-SARAI);--v-MAHLA:var(--v-SARAI);--v-LEA:var(--v-SARAH);--v-YOKHEVED:var(--v-SARAH);--v-BATYA:var(--v-SARAH);--v-TSIPORA:var(--v-SARAH);--v-NOA:var(--v-SARAH);--v-ATON:var(--v-SARAH);--v-ELIEZER:var(--v-MALAKH);--v-ESSAV:var(--v-AVRAM);--v-LAVAN:var(--v-AVRAM);--v-YEHOUDA:var(--v-AVRAM);--v-ECHANSON:var(--v-MALAKH);--v-PHARAON:var(--v-MALAKH);--v-AHARON:var(--v-AVRAM);--v-YITRO:var(--v-AVRAM);--v-KALEV:var(--v-AVRAM);--v-YEHOSHOUA:var(--v-MALAKH);--v-MERAGUEL:var(--v-N);--v-KORAH:var(--v-AVRAM);--v-BALAK:var(--v-MALAKH);--v-BILAM:var(--v-AVRAM);--v-REOUVEN:var(--v-AVRAM);}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,5.5vw,2.5rem)}
h2{font-size:1.3rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.he{font-family:var(--f-he);direction:rtl;unicode-bidi:isolate}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:8px;min-height:52px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.2rem;display:flex;align-items:center;gap:.55rem;margin-right:auto;color:inherit;text-decoration:none}
.brand img{display:block;width:auto}
.brand .mascot{height:46px;margin:-4px 0}
.brand .wordmark{height:22px}
@media (max-width:420px){.brand{gap:.35rem}.brand .mascot{height:40px}.brand .wordmark{height:17px}}
.icon-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:0 14px;height:42px;border-radius:999px;cursor:pointer;white-space:nowrap}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-btn.round{width:42px;padding:0;justify-content:center}
@media (max-width:420px){.icon-btn .lbl-long{display:none}}
@media (max-width:360px){#open-picker{width:42px;padding:0;justify-content:center}#open-picker>span{display:none}}

/* this week banner */
.week{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 16px;box-shadow:var(--shadow)}
.week p{margin:0;flex:1;min-width:0;font-size:.95rem}
.week b{font-family:var(--f-display)}
.pill{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);vertical-align:middle}
.pill.soft{background:var(--chip);color:var(--ink)}
.cta{border:0;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;white-space:nowrap}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
canvas#scene{width:100%;aspect-ratio:16/7;display:block;background:var(--chip)}
.hero-text{padding:16px 20px 18px;display:flex;flex-direction:column;gap:6px}
.hero-text p{margin:0}
#subtitle{color:var(--muted)}
@media (max-width:600px){#subtitle{font-size:.95rem;line-height:1.5}.hero-text{padding:14px 16px 14px}}
.epnav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px}
.epnav button{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:8px 10px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:.9rem;min-width:0}
.epnav button:hover{background:var(--chip);color:var(--ink)}
.epnav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.epnav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.epnav button:disabled{visibility:hidden}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:999px;align-self:flex-start}
.tab{border:0;background:transparent;padding:8px 18px;border-radius:999px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}

/* player */
.player{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:max(8px,env(safe-area-inset-top,0px));z-index:5;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:14px}
.play{flex:none;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(227,139,44,.35);transition:transform .15s}
.play:active{transform:scale(.94)}
.play svg{width:24px;height:24px;fill:currentColor}
.now{min-width:0;flex:1}
.now .who{font-size:.8rem;color:var(--muted);font-weight:600}
.now .line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;flex:none}
.bar{position:relative;height:28px;cursor:pointer;touch-action:none}
.bar::before{content:"";position:absolute;left:0;right:0;top:9px;height:10px;border-radius:6px;background:var(--chip)}
.bar .fill{position:absolute;left:0;top:9px;height:10px;background:var(--accent);border-radius:6px;width:0}
.bar .knob{position:absolute;top:6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);left:0}
.bar .mark{position:absolute;top:7px;width:2px;height:14px;background:var(--muted);opacity:.5;border-radius:1px}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.small{font-size:.85rem;border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;min-height:34px}
@media (max-width:480px){.player{padding:12px;gap:8px}.play{width:52px;height:52px}.row{gap:12px}.ctrls{gap:5px;flex-wrap:nowrap}.small{font-size:.78rem;padding:4px 9px;min-height:32px;white-space:nowrap}}
.small[aria-pressed="true"]{background:var(--chip);border-color:var(--chip);font-weight:600}
.resume{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linkish{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.85rem}

/* cast + story */
.cast{display:flex;flex-wrap:wrap;gap:6px}
.who-chip{display:flex;align-items:center;gap:6px;font-size:.82rem;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%}
.story{display:flex;flex-direction:column;gap:4px;font-size:1.05rem}
.scene{font-family:var(--f-display);font-size:1.1rem;color:var(--muted);margin:20px 0 4px;display:flex;align-items:center;gap:10px}
.scene::after{content:"";flex:1;height:1px;background:var(--line)}
.cue{padding:8px 12px;border-radius:12px;cursor:pointer;border-left:4px solid transparent;transition:background .25s}
.cue:hover{background:color-mix(in srgb,var(--hl) 50%,transparent)}
.cue .sp{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.cue.active{background:var(--hl)}
.w{background:var(--chip);border-radius:8px;padding:0 6px;white-space:nowrap;font-weight:600}
.w .he{font-weight:500;font-size:.85em;opacity:.8;margin-left:6px}
.the-end{text-align:center;color:var(--muted);padding:24px 0 8px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* parent sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
.sheet table{width:100%;border-collapse:collapse;font-size:.95rem}
.sheet td,.sheet th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.sheet th{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sheet td.he{font-size:1.25rem;text-align:right}
.sheet ul{margin:0;padding-inline-start:20px}
.sheet p{margin:0}
.q{background:var(--hl);border-radius:12px;padding:12px 14px}
.note{font-size:.85rem;color:var(--muted)}
.tw{overflow-x:auto}

/* story picker */
dialog#picker{border:0;padding:0;background:var(--bg);color:var(--ink);width:min(720px,100vw);max-width:100vw;max-height:min(88vh,900px);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog#picker::backdrop{background:rgba(20,18,48,.55);backdrop-filter:blur(2px)}
@media (max-width:600px){dialog#picker{margin:auto 0 0;width:100vw;max-height:92vh;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.pk-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:16px 16px 10px;z-index:1;border-bottom:1px solid var(--line)}
.pk-head h2{flex:1}
.pk-body{padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
.book{border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.book summary{cursor:pointer;padding:12px 16px;display:flex;align-items:baseline;gap:8px;list-style:none}
.book summary::-webkit-details-marker{display:none}
.book summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);align-self:center;transition:transform .2s}
.book[open] summary::after{transform:rotate(-135deg)}
.book summary b{font-family:var(--f-display);font-size:1.1rem}
.book summary span{color:var(--muted);font-size:.85rem}
.book.soon{padding:12px 16px;color:var(--muted);display:flex;align-items:baseline;gap:8px;opacity:.75}
.book.soon b{font-family:var(--f-display);font-size:1.1rem}
.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:0 10px 10px}
.ep{text-align:start;border:1px solid var(--line);background:var(--bg);padding:10px 12px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.ep:hover{border-color:var(--muted)}
.ep small{color:var(--muted);font-size:.75rem;letter-spacing:.05em;text-transform:uppercase}
.ep b{font-family:var(--f-display);font-size:1.02rem;line-height:1.25}
.ep .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.ep .badges:empty{display:none}
.ep[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

footer{text-align:center;font-size:.85rem;color:var(--muted);padding-top:12px;line-height:1.8}
footer .mail{color:inherit;opacity:.75;font-size:.8rem;text-decoration:none}
footer .mail:hover{opacity:1;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.cue,.play,.book summary::after{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./" aria-label="Jewishtory, accueil"><img class="mascot" src="logo-mascot.png" alt=""><img class="wordmark" src="logo-wordmark.png" alt="Jewishtory"></a>
    <button class="icon-btn" id="open-picker" aria-haspopup="dialog" aria-label="Toutes les parashiot">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Parasha<span class="lbl-long" id="count-lbl"></span></span>
    </button>
    <button class="icon-btn round" id="theme" aria-label="Changer de thème"><svg viewBox="0 0 24 24" id="theme-ico"></svg></button>
  </header>

  <div class="week" id="week" hidden></div>

  <article class="hero" aria-labelledby="title">
    <canvas id="scene" width="1120" height="490" aria-label="Illustration de l'histoire"></canvas>
    <div class="hero-text">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
    <nav class="epnav" aria-label="Épisode précédent ou suivant">
      <button id="prev"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span></span></button>
      <button id="next"><span></span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </nav>
  </article>

  <div class="player">
    <div class="row">
      <button class="play" id="play" aria-label="Écouter l'histoire"><svg viewBox="0 0 24 24" id="ico"><path d="M7 4l14 8-14 8z"/></svg></button>
      <div class="now"><div class="who" id="who">Prêt pour l'histoire ?</div><div class="line" id="line">Appuie sur ▶</div></div>
      <div class="time" id="time">0:00</div>
    </div>
    <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Position dans l'histoire" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    <div class="ctrls">
      <button class="small" id="back" aria-label="Reculer de 15 secondes">−15 s</button>
      <button class="small" id="fwd" aria-label="Avancer de 15 secondes">+15 s</button>
      <button class="small" id="slow" aria-pressed="false">Plus lent</button>
      <button class="small" id="follow" aria-pressed="true">Suivre le texte</button>
    </div>
    <div class="resume" id="resume" hidden></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-story" aria-selected="true" aria-controls="p-story">L'histoire</button>
    <button class="tab" role="tab" id="t-sheet" aria-selected="false" aria-controls="p-sheet">Fiche parent</button>
  </div>

  <section id="p-story" role="tabpanel" aria-labelledby="t-story" style="display:flex;flex-direction:column;gap:14px">
    <div class="cast" id="cast"></div>
    <div class="story" id="story"><p class="note">Chargement de l'histoire…</p></div>
    <div class="the-end" id="the-end" hidden></div>
  </section>

  <section id="p-sheet" role="tabpanel" aria-labelledby="t-sheet" hidden>
    <article class="sheet" id="sheet"></article>
  </section>

  <footer>Jewishtory · Une histoire du soir pour chaque paracha, en français avec des mots d'hébreu.<br><a class="mail" href="mailto:nmajersdorf@gmail.com">nmajersdorf@gmail.com</a></footer>
</div>

<dialog id="picker" aria-labelledby="pk-title">
  <div class="pk-head">
    <h2 id="pk-title">Toutes les parashiot</h2>
    <button class="icon-btn round" id="close-picker" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="pk-body" id="episodes"></div>
</dialog>

<audio id="audio" preload="metadata"></audio>

  {"id": "vayishlah", "dir": "episodes/vayishlah/", "book": "Bereshit", "parasha": "Vayishla'h", "title": "Le grand câlin des deux frères", "subtitle": "Yaakov a peur de retrouver Essav. Il envoie des cadeaux, lutte avec un ange toute la nuit, et les deux frères s'embrassent.", "art": "desert", "scenes": ["La grande caravane", "Les matanot", "La lutte de la nuit", "Le grand 'hibouk", "Retour au lit"], "sheet": {"words": [["מַתָּנָה", "matana", "le cadeau", "des troupeaux envoyés un par un"], ["פַּחַד", "pa'had", "la peur", "Yaakov l'avoue, et prie"], ["שֵׁם", "shem", "le nom", "l'ange lui en donne un nouveau"], ["חִבּוּק", "'hibouk", "le câlin", "Essav et Yaakov pleurent de joie"], ["יִשְׂרָאֵל", "Israël", "Israël", "le nouveau nom de Yaakov"]], "also": "Révisés : <b>tson</b>, <b>gmalim</b>, <b>malakh</b>, <b>brakha</b>, <b>ahava</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "En rentrant au pays, Yaakov apprend qu'Essav vient avec 400 hommes. Il prie, envoie des cadeaux et protège sa famille. La nuit, un mystérieux personnage lutte avec lui jusqu'à l'aube et lui donne le nom d'Israël. Le lendemain, Essav court vers lui et l'embrasse. Binyamin naît. (L'histoire de Dina et la mort de Ra'hel sont laissées de côté.)", "question": "« Yaakov a envoyé une matana après l'autre pour adoucir le cœur de son frère. Avec qui aimerais-tu faire la paix, et quelle matana tu lui offrirais ? »", "answer": "un 'hibouk", "ideas": ["Après une dispute, offrir un petit dessin : une matana de paix.", "Faire un 'hibouk à chaque membre de la famille avant de dormir.", "Chercher le mot « Israël » sur une carte.", "Dire tout haut une chose qui nous fait un peu pa'had : ça la rend plus petite."]}},
  {"id": "vayeshev", "dir": "episodes/vayeshev/", "book": "Bereshit", "parasha": "Vayeshev", "title": "La tunique de Yossef", "subtitle": "Yossef reçoit une tunique de toutes les couleurs, ses frères deviennent jaloux, et il part en Égypte.", "art": "desert", "scenes": ["La ktonet de Yossef", "Les 'halomot", "Le bor", "Yossef en Égypte", "Retour au lit"], "sheet": {"words": [["כְּתֹנֶת", "ktonet", "la tunique", "le cadeau de Yaakov à Yossef"], ["צְבָעִים", "tsva'im", "les couleurs", "toutes celles de l'arc-en-ciel"], ["אַחִים", "a'him", "les frères", "les onze frères de Yossef"], ["בּוֹר", "bor", "le trou, le puits sec", "les frères y font descendre Yossef"], ["קִנְאָה", "kin'a", "la jalousie", "un sentiment qui pique, qu'on peut dire"]], "also": "Révisés : <b>'halom</b>, <b>kokhavim</b>, <b>tson</b>, <b>shalom</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Yaakov offre à Yossef une tunique colorée ; Yossef raconte ses rêves (les gerbes, le soleil, la lune et onze étoiles) et ses frères deviennent jaloux. Ils le mettent dans un puits sec puis le vendent à des marchands qui vont en Égypte ; Yaakov croit qu'il est mort. En Égypte, Yossef réussit, puis va en prison « à cause d'un mensonge » (l'épisode de la femme de Potiphar est laissé de côté), où il explique le rêve de l'échanson, qui l'oublie.", "question": "« Les frères de Yossef ont laissé la kin'a décider à leur place. Toi, qu'est-ce que tu fais quand tu te sens un peu jaloux ? »", "answer": "je le dis, et la kin'a devient toute petite", "ideas": ["Dessiner une ktonet avec toutes les tsva'im et les nommer.", "Jouer à raconter son rêve du matin, comme Yossef.", "Quand on est jaloux, le dire à voix haute : « j'ai un peu de kin'a ».", "Compter onze étoiles sur un dessin de ciel."]}},
  {"id": "miketz", "dir": "episodes/miketz/", "book": "Bereshit", "parasha": "Miketz", "title": "Au palais de Pharaon", "subtitle": "Pharaon rêve de vaches maigres, Yossef devient le grand chef de l'Égypte, et ses frères viennent acheter du blé.", "art": "desert", "scenes": ["Le palais de Pharaon", "Les 'halomot du roi", "Le ra'av", "Les frères de Yossef", "Retour au lit"], "sheet": {"words": [["מֶלֶךְ", "mélekh", "le roi", "Pharaon, le mélekh d'Égypte"], ["פָּרוֹת", "parot", "les vaches", "sept grosses, sept maigres"], ["רָעָב", "ra'av", "la famine", "sept années sans récolte"], ["חָכְמָה", "'hokhma", "la sagesse", "l'idée de Yossef : garder le blé"], ["גְּבִיעַ", "guévia", "la coupe", "cachée dans le sac de Binyamin"]], "also": "Révisés : <b>'halom</b>, <b>a'him</b>, <b>Mitsraïm</b>, <b>lé'hem</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Pharaon rêve de sept vaches grasses mangées par sept vaches maigres. L'échanson se souvient de Yossef, qui explique : sept années d'abondance puis sept de famine. Pharaon le nomme vice-roi. Pendant la famine, les frères viennent acheter du blé sans le reconnaître ; Yossef garde Shimon et demande Binyamin. Au retour, il fait cacher sa coupe dans le sac de Binyamin. (L'épisode finit sur ce suspense.)", "question": "« Yossef a gardé du blé pendant les bonnes années pour les années difficiles. Toi, qu'est-ce que tu pourrais garder pour plus tard ? »", "answer": "un biscuit du goûter", "ideas": ["Garder un fruit du goûter pour le lendemain, comme Yossef avec le blé.", "Jouer au roi et dire « mélekh » en mettant une couronne.", "Dessiner sept parot grosses et sept maigres.", "Laisser l'enfant deviner la suite : que vont faire les a'him ?"]}},
  {"id": "vayigash", "dir": "episodes/vayigash/", "book": "Bereshit", "parasha": "Vayigash", "title": "Le grand secret de Yossef", "subtitle": "Yéhouda propose de prendre la place de Binyamin, Yossef révèle son secret, et Yaakov retrouve son fils.", "art": "desert", "scenes": ["Yéhouda s'avance", "Ani Yossef", "Les agalot de Pharaon", "Yaakov apprend la nouvelle", "Les retrouvailles", "Retour au lit"], "sheet": {"words": [["אֲנִי", "ani", "moi, je", "« Ani Yossef » : c'est moi, Yossef"], ["חַי", "'haï", "vivant", "« Est-ce que mon père est encore 'haï ? »"], ["עֲגָלוֹת", "agalot", "les chariots", "envoyés par Pharaon pour la famille"], ["מִשְׁפָּחָה", "mishpa'ha", "la famille", "soixante-dix personnes descendent en Égypte"], ["דְּמָעוֹת", "dma'ot", "les larmes", "des larmes de joie"]], "also": "Révisés : <b>a'him</b>, <b>guévia</b>, <b>mélekh</b>, <b>ra'av</b>, <b>'hibouk</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Yéhouda s'avance et propose de rester esclave à la place de Binyamin : les frères ont changé. Yossef ne peut plus se retenir et se révèle : « Je suis Yossef, mon père est-il encore vivant ? » Il rassure ses frères. Pharaon envoie des chariots, Yaakov reprend vie en apprenant la nouvelle, et toute la famille, soixante-dix personnes, s'installe à Goshen. Yossef et son père s'embrassent en pleurant.", "question": "« Yéhouda était prêt à tout pour protéger son petit frère. Toi, comment tu protèges les plus petits de la famille ? »", "answer": "on est une mishpa'ha", "ideas": ["Jouer à « Ani… » : chacun se présente en hébreu (« Ani Hillel »).", "Faire l'arbre de la mishpa'ha avec les photos des cousins.", "Construire des agalot avec des boîtes à chaussures.", "Raconter un jour où on a eu des dma'ot de joie."]}},
  {"id": "vayehi", "dir": "episodes/vayehi/", "book": "Bereshit", "parasha": "Vayé'hi", "title": "La bénédiction de Yaakov", "subtitle": "Yaakov bénit ses petits-enfants Éfraïm et Ménashé en croisant les mains, puis chacun de ses douze fils.", "art": "desert", "scenes": ["La yona revient", "Éfraïm et Ménashé", "Les douze brakhot", "La fin d'une longue vie", "Hazak !"], "sheet": {"words": [["נְכָדִים", "nékhadim", "les petits-enfants", "Éfraïm et Ménashé, les fils de Yossef"], ["יָדַיִם", "yadayim", "les mains", "Yaakov les croise pour bénir"], ["יָמִין", "yamin", "la droite", "la main de la plus grande bénédiction"], ["אַרְיֵה", "arié", "le lion", "la bénédiction de Yéhouda… et le prénom d'Arié !"], ["חֲזַק", "'hazak", "fort", "« 'Hazak, 'hazak, ve-nit'hazek » à la fin du livre"]], "also": "Révisés : <b>brakha</b>, <b>mishpa'ha</b>, <b>a'him</b>, <b>'hibouk</b>, <b>ahava</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Avant de mourir, Yaakov bénit Éfraïm et Ménashé en croisant les mains, et dit : « Par vous, Israël bénira : que Dieu te rende comme Éfraïm et Ménashé » (la bénédiction des enfants du vendredi soir). Il bénit ensuite chacun de ses fils, Yéhouda comme un lion. Il meurt entouré des siens et est enterré en Israël ; Yossef rassure ses frères. Fin du livre de Bereshit.", "question": "« Le vendredi soir, on bénit les garçons comme Éfraïm et Ménashé, et les filles comme Sarah, Rivka, Ra'hel et Léa. Tu sais pourquoi Éfraïm et Ménashé ? »", "answer": "ils ne se disputaient pas pour être le premier", "ideas": ["Ce vendredi soir, poser les yadayim sur la tête des enfants pour la brakha.", "Appeler les grands-parents et leur dire qu'ils ont des nékhadim formidables.", "Trouver tous les lions (arié) dans les livres de la maison.", "Crier ensemble « 'Hazak ! » à la fin d'un livre qu'on a fini."]}},
  {"id": "shemot", "dir": "episodes/shemot/", "book": "Shemot", "parasha": "Shemot", "title": "Le bébé dans le panier", "subtitle": "Bébé Moshé flotte sur le fleuve dans un panier, la princesse le sauve, et Hachem parle depuis un buisson en feu.", "art": "desert", "scenes": ["La yona revient", "Les lévénim", "La petite tévah", "La princesse", "Le puits du désert", "Le sné"], "sheet": {"words": [["לְבֵנִים", "lévénim", "les briques", "le travail des esclaves en Égypte"], ["יְאוֹר", "yéor", "le fleuve", "le Nil, où flotte le petit panier"], ["סְנֶה", "sné", "le buisson", "il brûle sans se consumer"], ["אֵשׁ", "esh", "le feu", "au milieu du buisson"], ["נַעֲלַיִם", "na'alayim", "les chaussures", "Moshé les enlève : la terre est sainte"]], "also": "Révisés : <b>tévah</b> (le même mot que l'arche de Noa'h !), <b>hinéni</b>, <b>bé'èr</b>, <b>tson</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Un nouveau Pharaon réduit les Hébreux en esclavage et donne « un ordre très méchant contre les bébés garçons » ; les sages-femmes Shifra et Poua les protègent. Yokhéved cache Moshé puis le pose dans un panier sur le Nil ; Myriam veille, la fille de Pharaon le sauve et Myriam fait engager sa propre mère comme nourrice. Moshé grandit au palais, défend un esclave, fuit, aide les filles de Yitro au puits et épouse Tsipora. Au buisson ardent, Hachem l'envoie libérer son peuple, avec Aharon.", "question": "« Myriam est restée cachée dans les roseaux pour veiller sur son petit frère. Toi, comment tu veilles sur ceux que tu aimes ? »", "answer": "comme Myriam", "ideas": ["Fabriquer une petite tévah en papier et la faire flotter dans le bain.", "Construire une tour de lévénim en Lego et dire le mot à chaque brique.", "Enlever ses na'alayim en entrant à la maison : « hinéni ! »", "Dessiner le sné qui brûle sans brûler."]}},
  {"id": "vaera", "dir": "episodes/vaera/", "book": "Shemot", "parasha": "Vaéra", "title": "Les grenouilles de Pharaon", "subtitle": "Moshé et Aharon devant Pharaon : le bâton-serpent, l'eau rouge, les grenouilles partout et la grêle de feu.", "art": "desert", "scenes": ["La yona revient", "Le maté devant Pharaon", "Le dam", "Les tsfardé'im", "Les autres plaies", "Le barad", "Retour au lit"], "sheet": {"words": [["מַטֶּה", "maté", "le bâton", "le bâton de Moshé et d'Aharon"], ["צְפַרְדֵּעַ", "tsfardéa", "la grenouille", "même dans le chapeau de Pharaon !"], ["דָּם", "dam", "le sang", "l'eau du fleuve devient rouge"], ["בָּרָד", "barad", "la grêle", "avec du feu dedans"], ["לֵב", "lev", "le cœur", "le lev dur de Pharaon"]], "also": "Révisés : <b>yéor</b>, <b>lévénim</b>, <b>esh</b>, <b>mayim</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Moshé et Aharon demandent à Pharaon de laisser partir le peuple ; le bâton d'Aharon devient un serpent qui avale ceux des magiciens. Les sept premières plaies frappent l'Égypte (sang, grenouilles, poux, bêtes sauvages, épidémie, ulcères, grêle mêlée de feu) mais épargnent Goshen. À chaque fois Pharaon promet puis change d'avis : son cœur s'endurcit.", "question": "« Pharaon promettait puis changeait d'avis. Toi, est-ce que c'est facile de tenir une promesse ? »", "answer": "une promesse, c'est une promesse", "ideas": ["Jouer à saute-grenouille en criant « tsfardéa ! ».", "Faire une promesse simple pour la semaine et la tenir.", "Écouter son lev battre après avoir couru.", "Fabriquer un maté avec un bâton trouvé en promenade."]}},
  {"id": "bo", "dir": "episodes/bo/", "book": "Shemot", "parasha": "Bo", "title": "La nuit de Pessa'h", "subtitle": "Sauterelles, obscurité, et la première nuit de Pessa'h : la pâte n'a pas le temps de lever, on sort d'Égypte.", "art": "desert", "scenes": ["La yona revient", "L'arbé", "Le 'hoshekh et l'or", "La nuit de Pessa'h", "La sortie d'Égypte", "Retour au lit"], "sheet": {"words": [["אַרְבֶּה", "arbé", "les sauterelles", "elles mangent tout ce qui est vert"], ["חֹשֶׁךְ", "'hoshekh", "l'obscurité", "trois jours de nuit en Égypte"], ["אוֹר", "or", "la lumière", "chez les Hébreux, même dans le 'hoshekh"], ["מַצָּה", "matsa", "le pain plat", "pas le temps de laisser lever la pâte"], ["פֶּסַח", "Pessa'h", "Pâque, passer au-dessus", "Hachem passe au-dessus des maisons marquées"]], "also": "Révisés : <b>maté</b>, <b>lev</b>, <b>lé'hem</b>, <b>mishpa'ha</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Pharaon veut garder les enfants : Moshé refuse, tout le monde partira. Viennent les sauterelles puis les ténèbres, mais il fait clair chez les Hébreux. Moshé annonce la nuit de Pessa'h : un agneau par famille, une marque sur les portes, la pâte cuite sans lever. À minuit vient la dernière plaie, « la plus terrible, chez les Égyptiens » (dite sans détail), et Pharaon chasse le peuple. On emporte les ossements de Yossef.", "question": "« À Pessa'h, ce sont les enfants qui posent les questions. Quelle question tu aimerais poser au Seder ? »", "answer": "« Ma nichtana ? »", "ideas": ["Faire une matsa express : farine + eau, au four en moins de 18 minutes.", "Éteindre les lumières et allumer une seule bougie : « 'hoshekh… or ! »", "Apprendre le début du Ma nichtana.", "Préparer des « sacs de départ » comme si on sortait d'Égypte cette nuit."]}},
  {"id": "beshalah", "dir": "episodes/beshalah/", "book": "Shemot", "parasha": "Beshala'h", "title": "La mer qui s'ouvre", "subtitle": "La mer s'ouvre, Myriam danse avec son tambourin, et le man tombe du ciel avec une double part pour Chabbat.", "art": "desert", "scenes": ["La yona revient", "Le yam s'ouvre", "La shira de Myriam", "Le man du ciel", "Retour au lit"], "sheet": {"words": [["יָם", "yam", "la mer", "elle s'ouvre en deux murs d'eau"], ["רוּחַ", "rou'ah", "le vent", "il souffle toute la nuit"], ["שִׁירָה", "shira", "le chant", "le chant de la mer"], ["תֹּף", "tof", "le tambourin", "celui de Myriam"], ["מָן", "man", "la manne", "le pain du ciel au goût de miel"]], "also": "Révisés : <b>maté</b>, <b>matsa</b>, <b>lé'hem</b>, <b>Chabbat</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Pharaon poursuit les Hébreux jusqu'à la mer. Moshé lève son bâton, un vent d'est ouvre la mer et le peuple traverse à pied sec ; les eaux se referment et l'armée ne peut plus les rattraper (raconté sans image effrayante). Moshé et le peuple chantent, Myriam danse avec les femmes au tambourin. Dans le désert, Hachem envoie la manne chaque matin, et une double part le vendredi pour Chabbat. (Amalek est laissé de côté.)", "question": "« Myriam avait préparé son tof avant de partir, parce qu'elle savait qu'un jour on serait libres. Toi, qu'est-ce qui te donne envie de chanter ? »", "answer": "une shira de joie", "ideas": ["Au bain, ouvrir l'eau avec les mains : « yam ! »", "Fabriquer un tof avec une boîte et des grelots.", "Le vendredi, montrer les deux 'hallot : la double part de man.", "Souffler très fort pour faire du rou'ah sur des plumes."]}},
  {"id": "yitro", "dir": "episodes/yitro/", "book": "Shemot", "parasha": "Yitro", "title": "Au pied du mont Sinaï", "subtitle": "Yitro apprend à Moshé à partager le travail, puis tout le peuple entend les Dix Paroles au mont Sinaï.", "art": "desert", "scenes": ["La yona revient", "Le conseil de Yitro", "Na'assé vénishma", "Le kol au Sinaï", "Retour au lit"], "sheet": {"words": [["עָנָן", "anan", "le nuage", "il couvre le mont Sinaï"], ["קוֹל", "kol", "la voix, le son", "le shofar et la voix de Hachem"], ["עֶשֶׂר", "ésser", "dix", "les dix paroles"], ["לוּחוֹת", "lou'hot", "les tables", "les deux pierres gravées"], ["נַעֲשֶׂה וְנִשְׁמָע", "na'assé vénishma", "nous ferons et nous comprendrons", "la réponse du peuple"]], "also": "Révisés : <b>har</b>, <b>shofar</b>, <b>mishpa'ha</b>, <b>Chabbat</b>, <b>ohel</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Yitro, le beau-père de Moshé, voit Moshé juger le peuple seul du matin au soir et lui conseille de nommer des juges : Moshé l'écoute. Trois mois après la sortie d'Égypte, le peuple se prépare trois jours au pied du Sinaï et répond « Na'assé vénishma ». Dans le nuage, le tonnerre et le shofar, Hachem prononce les Dix Paroles, puis Moshé monte recevoir les tables.", "question": "« Yitro a dit à Moshé : tu ne peux pas tout faire tout seul. À la maison, qu'est-ce que tu pourrais faire pour aider ? »", "answer": "on partage le travail", "ideas": ["Faire un tableau des tâches de la maison : chacun la sienne.", "Compter jusqu'à 'esser' sur ses doigts en hébreu.", "Dessiner les deux lou'hot avec les chiffres de 1 à 10.", "Dire « na'assé vénishma » quand on accepte une surprise."]}},
  {"id": "mishpatim", "dir": "episodes/mishpatim/", "book": "Shemot", "parasha": "Mishpatim", "title": "L'âne qui tombe", "subtitle": "On rend un bœuf perdu, on relève un âne tombé même chez un voisin fâché, et on aime l'étranger.", "art": "desert", "scenes": ["La yona revient", "Le shor perdu", "Le 'hamor qui tombe", "Le guer et les 'haguim", "Moshé remonte", "Retour au lit"], "sheet": {"words": [["שׁוֹר", "shor", "le bœuf", "on le ramène à son propriétaire"], ["חֲמוֹר", "'hamor", "l'âne", "on aide à le relever"], ["גֵּר", "guer", "l'étranger", "« vous avez été étrangers en Égypte »"], ["חַגִּים", "'haguim", "les fêtes", "Pessa'h, Shavouot, Souccot"], ["צֶדֶק", "tsédek", "la justice", "pour les grands comme pour les petits"]], "also": "Révisés : <b>har</b>, <b>anan</b>, <b>lou'hot</b>, <b>na'assé vénishma</b>, <b>Chabbat</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Après les Dix Paroles, la Torah donne des lois pour la vie de tous les jours. L'épisode en retient quelques-unes : rendre l'animal perdu, aider à relever l'âne même de quelqu'un avec qui on est fâché, ne pas faire de peine à l'étranger, le Chabbat (aussi pour les animaux), les trois fêtes de pèlerinage. Le peuple répond encore « Na'assé vénishma » et Moshé monte quarante jours sur la montagne.", "question": "« Arié a trouvé un ballon et l'a gardé. Qu'est-ce qu'on fait quand on trouve quelque chose qui n'est pas à nous ? »", "answer": "on cherche à qui il est", "ideas": ["Rendre un objet trouvé à l'école ou au parc.", "Inviter à jouer un enfant nouveau dans la classe : un guer.", "Chercher un shor et un 'hamor dans un livre d'animaux.", "Faire la liste des 'haguim préférés de chacun."]}},
  {"id": "terouma", "dir": "episodes/terouma/", "book": "Shemot", "parasha": "Terouma", "title": "La maison de Hachem", "subtitle": "Chacun apporte un cadeau du cœur pour construire le Mishkan, et Hillel donne sa bille bleue.", "art": "desert", "scenes": ["La yona revient", "Les teroumot", "L'aron et les krouvim", "La ménora", "Retour au lit"], "sheet": {"words": [["תְּרוּמָה", "terouma", "le don, l'offrande", "chacun donne selon son cœur"], ["מִשְׁכָּן", "mishkan", "le sanctuaire", "la maison de Hachem au milieu du camp"], ["אָרוֹן", "aron", "l'arche", "la boîte en or pour les tables"], ["כְּרוּבִים", "krouvim", "les chérubins", "deux anges aux visages d'enfants"], ["מְנוֹרָה", "ménora", "le chandelier", "sept branches, en un seul bloc d'or"]], "also": "Révisés : <b>lou'hot</b>, <b>lé'hem</b>, <b>or</b>, <b>lev</b>, <b>Chabbat</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Hachem demande à Moshé : « Qu'ils me fassent un sanctuaire, et j'habiterai au milieu d'eux. » Chacun apporte une offrande « selon son cœur » ; il y en a tant que Moshé doit arrêter les dons. Betsalel fabrique l'arche avec les chérubins, la table des pains et la ménora d'or martelé. (Dans l'épisode, la bille d'Hillel est aussi précieuse que l'or.)", "question": "« Pour Hachem, la plus belle terouma, c'est celle qui vient du cœur. Qu'est-ce que tu aimerais donner, toi ? »", "answer": "même une bille bleue", "ideas": ["Mettre une pièce dans la boîte de tsédaka avant Chabbat.", "Construire un petit mishkan avec une boîte et du papier doré.", "Compter les sept branches d'une ménora.", "Ranger un coin de la chambre pour en faire un « petit mishkan »."]}},
  {"id": "tetsave", "dir": "episodes/tetsave/", "book": "Shemot", "parasha": "Tetsavé", "title": "Les clochettes d'Aharon", "subtitle": "On presse des olives pour la lumière de la ménora, et Aharon reçoit des habits avec douze pierres et des clochettes d'or.", "art": "desert", "scenes": ["La yona revient", "Le shémen pur", "Les paamonim", "Le 'hoshen", "Retour au lit"], "sheet": {"words": [["שֶׁמֶן", "shémen", "l'huile", "la première goutte d'olive, la plus pure"], ["נֵר תָּמִיד", "ner tamid", "la lumière perpétuelle", "elle brille toute la nuit, comme une veilleuse"], ["פַּעֲמוֹנִים", "paamonim", "les clochettes", "sur la robe d'Aharon : ding, ding"], ["אֲבָנִים", "avanim", "les pierres", "douze pierres précieuses"], ["חֹשֶׁן", "'hoshen", "le pectoral", "porté sur le cœur, avec les noms des tribus"]], "also": "Révisés : <b>ménora</b>, <b>mishkan</b>, <b>or</b>, <b>aron</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Hachem demande de l'huile d'olive pure pour que la lumière brûle toujours. Aharon et ses fils sont choisis comme prêtres et reçoivent des habits d'honneur : la robe bleue bordée de grenades et de clochettes d'or, le pectoral aux douze pierres gravées des noms des tribus, porté sur le cœur, et la plaque « Saint pour Hachem ».", "question": "« Aharon porte les noms de tout le peuple sur son cœur. Et toi, quels noms tu portes dans ton cœur ? »", "answer": "toute la famille", "ideas": ["Presser une olive ou un citron pour voir la première goutte.", "Regarder le ner tamid à la synagogue.", "Frapper avant d'entrer : « ding, ding », comme les paamonim.", "Faire un 'hoshen avec douze gommettes de couleur et les prénoms de la famille."]}},
  {"id": "ki-tissa", "dir": "episodes/ki-tissa/", "book": "Shemot", "parasha": "Ki Tissa", "title": "Le veau d'or", "subtitle": "Moshé tarde à redescendre, le peuple perd patience et fabrique un veau d'or, puis on demande pardon et on reçoit de nouvelles tables.", "art": "desert", "scenes": ["La yona revient", "Plus de savlanout", "Les lou'hot cassées", "Sli'ha", "Les panim de Moshé", "Retour au lit"], "sheet": {"words": [["סַבְלָנוּת", "savlanout", "la patience", "le peuple n'en a plus"], ["זָהָב", "zahav", "l'or", "les boucles d'oreilles fondues"], ["עֵגֶל", "égel", "le veau", "le veau d'or"], ["סְלִיחָה", "sli'ha", "pardon", "Moshé le demande pour tout le peuple"], ["פָּנִים", "panim", "le visage", "celui de Moshé brille"]], "also": "Révisés : <b>har</b>, <b>anan</b>, <b>lou'hot</b>, <b>lev</b>, <b>man</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Quarante jours ont passé et Moshé ne revient pas : le peuple s'inquiète et demande une statue ; Aharon tente de gagner du temps, mais le veau d'or est fabriqué. Moshé redescend et brise les tables. Il prie pour le peuple, Hachem pardonne, enseigne ses treize attributs de miséricorde (« Hachem, Hachem, plein de tendresse… ») et donne de nouvelles tables. Le visage de Moshé rayonne. (La punition des Léviim est laissée de côté.)", "question": "« Hillel n'a pas eu de savlanout devant le gâteau, puis il a dit sli'ha. Toi, quand est-ce que c'est difficile d'attendre ? »", "answer": "on peut toujours demander sli'ha", "ideas": ["Jouer au sablier : attendre sans bouger jusqu'au bout, c'est la savlanout.", "S'entraîner à dire « sli'ha » et « toda ».", "Trouver tout ce qui est en zahav dans la maison.", "Faire une « deuxième chance » : réparer un dessin raté."]}},
  {"id": "vayakhel-pekoude", "dir": "episodes/vayakhel-pekoude/", "book": "Shemot", "parasha": "Vayakhel-Pekoudé", "title": "Le nuage dans le Mishkan", "subtitle": "Tout le peuple construit ensemble le Mishkan, avec les miroirs des femmes, et le nuage vient l'habiter.", "art": "desert", "scenes": ["La yona revient", "Chabbat d'abord", "Les 'houtim", "Les miroirs", "Le mishkan monté", "Le kavod"], "sheet": {"words": [["קָהָל", "kahal", "l'assemblée", "tout le monde rassemblé"], ["חוּטִים", "'houtim", "les fils", "on les file avec Myriam"], ["מַרְאוֹת", "mar'ot", "les miroirs", "ceux des femmes en Égypte"], ["מְלָאכָה", "mélakha", "le travail", "six jours, puis Chabbat"], ["כָּבוֹד", "kavod", "la gloire, la présence", "le nuage remplit le Mishkan"]], "also": "Révisés : <b>mishkan</b>, <b>Chabbat</b>, <b>anan</b>, <b>ménora</b>, <b>aron</b>, <b>'hazak</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Moshé rassemble le peuple et rappelle d'abord le Chabbat : même pour le Mishkan, on s'arrête. Tous construisent : les femmes filent, Betsalel dirige, et les miroirs de cuivre des femmes deviennent la cuve. Moshé vérifie que tout est fait comme demandé et bénit le peuple. Le Mishkan est monté, et la nuée de Hachem le remplit. Fin du livre de Shemot.", "question": "« Chacun a fait un morceau du Mishkan, même avec un fil tordu. Dans notre famille, quel est ton morceau à toi ? »", "answer": "comme un grand puzzle", "ideas": ["Faire un puzzle tous ensemble, chacun sa partie.", "Essayer de filer de la laine ou de tresser des fils.", "Se regarder dans un miroir et se dire un mot gentil.", "Crier « 'Hazak ! » à la fin d'un projet de famille."]}},
  {"id": "vayikra", "dir": "episodes/vayikra/", "book": "Vayikra", "parasha": "Vayikra", "title": "Le cadeau du pauvre", "subtitle": "Le petit aleph de Moshé, les cadeaux pour se rapprocher de Hachem, et la poignée de farine du pauvre.", "art": "desert", "scenes": ["La yona revient", "Le korban", "Le cadeau du pauvre", "Le méla'h", "Retour au lit"], "sheet": {"words": [["קָרְבָּן", "korban", "l'offrande", "un cadeau pour se rapprocher"], ["קָרוֹב", "karov", "proche", "le mot d'où vient korban"], ["מֶלַח", "méla'h", "le sel", "sur chaque offrande, comme l'amitié"], ["סֹלֶת", "solet", "la fleur de farine", "l'offrande du pauvre"], ["עֲנָוָה", "anava", "l'humilité", "le petit aleph de Vayikra"]], "also": "Révisés : <b>mishkan</b>, <b>kohen</b>, <b>lev</b>, <b>shémen</b>, <b>yonim</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Hachem appelle Moshé depuis le Mishkan (le mot « vayikra » s'écrit avec un petit aleph, signe d'humilité selon les sages). Le livre décrit les offrandes : bœuf, mouton, colombes ou simple farine pour qui est pauvre, et la Torah dit de ce dernier « une âme ». Chaque offrande reçoit du sel, signe d'alliance. L'épisode n'en montre aucun abattage.", "question": "« Le pauvre a donné une poignée de farine, et c'était aussi précieux qu'un bœuf. Qu'est-ce qui rend un cadeau précieux ? »", "answer": "le lev qu'on met dedans", "ideas": ["Préparer un cadeau fait main pour quelqu'un de la famille.", "Mettre le méla'h sur la 'halla vendredi et expliquer pourquoi.", "Écrire « Vayikra » avec un tout petit aleph.", "Se faire un câlin : être karov."]}},
  {"id": "tsav", "dir": "episodes/tsav/", "book": "Vayikra", "parasha": "Tsav", "title": "Le feu qui ne s'éteint jamais", "subtitle": "Le feu de l'autel ne s'éteint jamais, le grand prêtre commence par enlever la cendre, et on partage les pains du merci.", "art": "desert", "scenes": ["La yona revient", "L'esh tamid", "L'éfer du matin", "Le korban toda", "Les shiv'a jours"], "sheet": {"words": [["מִזְבֵּחַ", "mizbéa'h", "l'autel", "le feu y brûle jour et nuit"], ["תָּמִיד", "tamid", "toujours", "un feu qui ne s'éteint pas"], ["אֵפֶר", "éfer", "la cendre", "le kohen l'enlève chaque matin"], ["חָמֵץ", "'hamets", "le pain levé", "dans le korban toda"], ["שִׁבְעָה", "shiv'a", "sept", "sept jours de préparation"]], "also": "Révisés : <b>esh</b>, <b>kohen</b>, <b>korban</b>, <b>lé'hem</b>, <b>matsa</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Un feu doit brûler en permanence sur l'autel ; chaque matin, le prêtre en vêtements simples retire la cendre. L'offrande de remerciement (toda) comprend des pains levés et azymes, à manger le jour même, ce qui oblige à inviter. Aharon et ses fils restent sept jours à l'entrée du sanctuaire pendant leur consécration.", "question": "« Le monsieur a dit merci avec un panier de pains. Pour quoi tu aimerais dire toda aujourd'hui ? »", "answer": "une chose nouvelle chaque jour", "ideas": ["Chaque soir, dire un nouveau « toda » de la journée.", "Aider à vider les cendres de la cheminée ou à balayer : le travail simple d'abord.", "Allumer une veilleuse « tamid » dans le couloir.", "Partager un pain avec les voisins, comme le korban toda."]}},
  {"id": "shemini", "dir": "episodes/shemini/", "book": "Vayikra", "parasha": "Shemini", "title": "Les poissons à écailles", "subtitle": "Le feu descend du ciel le huitième jour, puis Aharon fait deviner aux enfants quels animaux sont kasher.", "art": "desert", "scenes": ["La yona revient", "Le feu du ciel", "Le jeu des animaux", "Les dagim", "Retour au lit"], "sheet": {"words": [["שְׁמִינִי", "shmini", "le huitième", "le grand jour de l'inauguration"], ["כָּשֵׁר", "kasher", "permis, qui convient", "les règles des animaux"], ["דָּגִים", "dagim", "les poissons", "dans le ruisseau"], ["סְנַפִּיר", "snapir", "la nageoire", "il en faut pour qu'un poisson soit kasher"], ["קַשְׂקֶשֶׂת", "kaskéssèt", "les écailles", "comme des petites tuiles brillantes"]], "also": "Révisés : <b>mizbéa'h</b>, <b>esh</b>, <b>kohen</b>, <b>mishkan</b>, <b>kavod</b>, <b>shor</b>, <b>gamal</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Le huitième jour, Aharon offre les premiers sacrifices et bénit le peuple ; un feu descend du ciel et tout le monde exulte. La paracha donne ensuite les règles des animaux permis : sabots fendus et rumination, nageoires et écailles, liste des oiseaux. (La mort de Nadav et Avihou, les fils d'Aharon, est laissée hors de l'épisode : à raconter si l'enfant est prêt.)", "question": "« Pour qu'un poisson soit kasher, il lui faut deux choses. Tu te souviens lesquelles ? »", "answer": "des snapirim et de la kaskéssèt", "ideas": ["Au marché ou à la poissonnerie, chercher les snapirim et la kaskéssèt.", "Jouer au « kasher, pas kasher » avec un livre d'animaux.", "Mâcher très longtemps comme une vache qui rumine.", "Répéter la bénédiction des kohanim en levant les mains."]}},
  {"id": "tazria-metsora", "dir": "episodes/tazria-metsora/", "book": "Vayikra", "parasha": "Tazria-Metsora", "title": "Les taches sur le mur", "subtitle": "La fête d'un bébé le huitième jour, puis des taches sur les murs qui apprennent à faire attention à nos mots.", "art": "desert", "scenes": ["La brit du tinok", "Les taches sur le mur", "La guérison", "L'oreiller de plumes", "Retour au lit"], "sheet": {"words": [["תִּינוֹק", "tinok", "le bébé", "il fête sa brit le huitième jour"], ["בְּרִית", "brit", "l'alliance", "la brit mila, comme Avraham"], ["מִלִּים", "milim", "les mots", "ils peuvent construire ou casser"], ["לָשׁוֹן הָרָע", "lashon hara", "la médisance", "dire du mal de quelqu'un qui n'est pas là"], ["בַּיִת", "bayit", "la maison", "les taches apparaissent d'abord sur ses murs"]], "also": "Révisés : <b>shmini</b>, <b>kohen</b>, <b>lev</b>, <b>mazal tov</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "La paracha parle de la naissance et de la circoncision au huitième jour, puis de la tsara'at, une affection des murs, des habits et de la peau que le prêtre examine. Les sages la relient à la médisance : la personne s'isole quelques jours, le prêtre vient la voir, et à la guérison un oiseau est libéré. L'épisode ajoute la parabole de l'oreiller de plumes.", "question": "« Une fois que les plumes de l'oreiller sont parties, on ne peut plus les rattraper. Que peut-on faire après avoir dit quelque chose de pas gentil ? »", "answer": "demander pardon et dire des milim gentilles", "ideas": ["Pour chaque mot pas gentil, trouver deux milim gentilles.", "Regarder ses photos de bébé : « tinok ! »", "Souffler sur un pissenlit pour voir les « plumes » s'envoler.", "Faire un compliment sur quelqu'un qui n'est pas là."]}},
  {"id": "aharei-mot-kedoshim", "dir": "episodes/aharei-mot-kedoshim/", "book": "Vayikra", "parasha": "A'harei Mot-Kedoshim", "title": "Le coin du champ", "subtitle": "Yom Kippour dans le Mishkan, puis être « kadosh » au quotidien : le coin du champ, la pierre sur le chemin, aimer son prochain.", "art": "desert", "scenes": ["La yona revient", "Yom Kippour", "Soyez kédoshim", "La péa", "Le mikhshol et le zaken", "Sur un pied"], "sheet": {"words": [["קָדוֹשׁ", "kadosh", "saint, spécial", "« Soyez saints car je suis saint »"], ["רֵעַ", "réa", "le prochain", "« Tu aimeras ton prochain comme toi-même »"], ["פֵּאָה", "péa", "le coin du champ", "laissé aux pauvres"], ["זָקֵן", "zaken", "la personne âgée", "on se lève devant elle"], ["מִכְשׁוֹל", "mikhshol", "l'obstacle", "on n'en met pas devant un aveugle"]], "also": "Révisés : <b>sli'ha</b>, <b>kohen gadol</b>, <b>sadé</b>, <b>lev</b>, <b>Yom Kippour</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "A'harei Mot décrit le service de Yom Kippour : le grand prêtre en blanc entre dans le Saint des saints, et un bouc emporte symboliquement les fautes au désert. Kedoshim demande d'être saint dans la vie concrète : laisser le coin du champ aux pauvres, ne pas mettre d'obstacle devant un aveugle, se lever devant les anciens, aimer son prochain comme soi-même. L'épisode raconte l'histoire de Hillel « sur un pied ».", "question": "« Hillel a expliqué toute la Torah sur un pied. Tu te souviens de sa phrase ? »", "answer": "ce que tu n'aimes pas qu'on te fasse, ne le fais pas aux autres", "ideas": ["Laisser une « péa » : un bout de goûter pour un copain qui n'en a pas.", "Ranger ce qui traîne par terre : enlever les mikhshol.", "Se lever pour un zaken dans le bus.", "Essayer de dire la phrase de Hillel sur un pied."]}},
  {"id": "emor", "dir": "episodes/emor/", "book": "Vayikra", "parasha": "Emor", "title": "Le calendrier des fêtes", "subtitle": "La yona fait traverser toute une année en une nuit : Chabbat, Pessa'h, le compte de l'omer, Shavouot, Roch Hachana, Kippour et Souccot.", "art": "desert", "scenes": ["La yona revient", "Le Chabbat", "Pessa'h et l'omer", "Shavouot", "Roch Hachana et Kippour", "La soukka", "La roue de l'année"], "sheet": {"words": [["מוֹעֲדִים", "mo'adim", "les fêtes, les rendez-vous", "les rendez-vous avec Hachem"], ["עֹמֶר", "omer", "la gerbe", "on compte quarante-neuf jours"], ["לִסְפֹּר", "lispor", "compter", "de Pessa'h à Shavouot"], ["סֻכָּה", "soukka", "la cabane", "avec des trous pour voir les étoiles"], ["לוּלָב", "loulav", "la branche de palmier", "on l'agite dans toutes les directions"]], "also": "Révisés : <b>Chabbat</b>, <b>Pessa'h</b>, <b>matsa</b>, <b>Shavouot</b>, <b>shofar</b>, <b>Yom Kippour</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Emor donne des règles pour les prêtres puis le calendrier des fêtes : le Chabbat, Pessa'h, l'offrande de l'omer et les sept semaines comptées jusqu'à Shavouot, Roch Hachana et le shofar, Yom Kippour, Souccot avec la cabane et les quatre espèces. L'épisode se concentre sur les fêtes.", "question": "« On compte les jours de l'omer quand on attend quelque chose de beau. Toi, qu'est-ce que tu attends en comptant les dodos ? »", "answer": "la prochaine fête", "ideas": ["Écrire tous les mo'adim sur le calendrier du frigo.", "Faire un compte à rebours jusqu'à la prochaine fête : « lispor ».", "Construire une mini-soukka avec des bâtonnets.", "Agiter un loulav imaginaire dans les six directions."]}},
  {"id": "behar-behoukotai", "dir": "episodes/behar-behoukotai/", "book": "Vayikra", "parasha": "Behar-Be'houkotai", "title": "Le Chabbat de la terre", "subtitle": "Tous les sept ans, la terre fait Chabbat ; tous les cinquante ans, le shofar annonce la liberté pour tous.", "art": "desert", "scenes": ["La yona revient", "La shmita", "Le yovel", "Les brakhot", "Retour au lit"], "sheet": {"words": [["אֲדָמָה", "adama", "la terre", "celle du potager de Papi"], ["שְׁמִטָּה", "shmita", "l'année sabbatique", "la septième année, la terre se repose"], ["יוֹבֵל", "yovel", "le jubilé", "la cinquantième année"], ["דְּרוֹר", "dror", "la liberté", "aussi le nom d'un petit oiseau"], ["גֶּשֶׁם", "guéshem", "la pluie", "« au bon moment », une bénédiction"]], "also": "Révisés : <b>Chabbat</b>, <b>shofar</b>, <b>sadé</b>, <b>brakha</b>, <b>man</b>, <b>'hazak</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Behar institue la shmita (tous les sept ans la terre se repose et ce qui pousse est à tous) et le jubilé (la cinquantième année, on sonne le shofar, les esclaves sont libérés et chaque famille récupère sa terre). Be'houkotai promet les bénédictions de la pluie, des récoltes et de la paix ; les malédictions sont laissées de côté. Fin du livre de Vayikra.", "question": "« Papi laisse un coin du jardin se reposer. Et toi, quand est-ce que tu as besoin de repos ? »", "answer": "comme l'adama, chacun a besoin de son Chabbat", "ideas": ["Laisser un pot de terre « en shmita » et voir ce qui pousse tout seul.", "Écouter la pluie et dire « guéshem ».", "Chercher l'oiseau dror (le moineau) au parc.", "Planter une graine et dire merci pour l'adama."]}},
  {"id": "bamidbar", "dir": "episodes/bamidbar/", "book": "Bamidbar", "parasha": "Bamidbar", "title": "Les douze drapeaux", "subtitle": "On compte chaque personne par son nom, et les douze tribus campent autour du Mishkan, chacune sous son drapeau.", "art": "desert", "scenes": ["La yona revient", "Chacun compte", "Les dégalim", "Le ma'hané vu du ciel", "En route !", "Retour au lit"], "sheet": {"words": [["מִדְבָּר", "midbar", "le désert", "là où la Torah a été donnée"], ["לִסְפֹּר", "lispor", "compter", "chaque personne, par son nom"], ["דֶּגֶל", "dégel", "le drapeau", "un par tribu, de la couleur de sa pierre"], ["שְׁבָטִים", "shvatim", "les tribus", "les douze fils de Yaakov"], ["מַחֲנֶה", "ma'hané", "le camp", "un grand carré autour du Mishkan"]], "also": "Révisés : <b>mishkan</b>, <b>avanim</b>, <b>'hoshen</b>, <b>arié</b>, <b>anan</b>, <b>aron</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Dans le désert du Sinaï, Moshé recense le peuple, tribu par tribu. Les douze tribus campent en carré autour du Mishkan, trois de chaque côté, chacune sous son étendard ; les Léviim entourent le sanctuaire et le portent pendant les voyages. Les sages expliquent que la Torah fut donnée dans le désert, lieu qui n'appartient à personne.", "question": "« Aharon a écrit le nom d'Hillel dans le grand livre. Pourquoi c'est important que chacun soit compté par son nom ? »", "answer": "parce que chacun compte", "ideas": ["Dessiner le dégel de la famille, avec un symbole par personne.", "Faire l'appel à table, chacun répond « hinéni ».", "Construire le ma'hané avec des Playmobil autour d'une boîte.", "Compter les membres de la famille élargie : « lispor »."]}},
  {"id": "nasso", "dir": "episodes/nasso/", "book": "Bamidbar", "parasha": "Nasso", "title": "Les douze cadeaux pareils", "subtitle": "Un nazir aux cheveux très longs, la bénédiction des kohanim, et douze princes qui apportent exactement le même cadeau.", "art": "desert", "scenes": ["La yona revient", "Le nazir", "Yévarékhékha", "Les douze nessi'im"], "sheet": {"words": [["נָשִׂיא", "nassi", "le prince, le chef", "un par tribu"], ["זֵהֶה", "zéhé", "identique", "les douze cadeaux sont pareils"], ["עֲנָבִים", "anavim", "les raisins", "le nazir n'en mange pas"], ["שֵׂעָר", "séar", "les cheveux", "le nazir ne les coupe pas"], ["יְבָרֶכְךָ", "yévarékhékha", "qu'Il te bénisse", "le début de la bénédiction des kohanim"]], "also": "Révisés : <b>mishkan</b>, <b>agalot</b>, <b>shor</b>, <b>kohanim</b>, <b>shalom</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Nasso décrit le nazir, qui s'engage un temps à ne pas boire de vin ni se couper les cheveux, puis la bénédiction des prêtres (« Que Hachem te bénisse et te garde… »). Pour l'inauguration du Mishkan, les douze princes offrent des chariots, puis chacun, un jour différent, exactement la même offrande, que la Torah détaille douze fois. (Le passage de la sota est laissé de côté.)", "question": "« Les douze princes ont apporté le même cadeau pour que personne ne soit jaloux. Pourtant chaque cadeau compte. Pourquoi ? »", "answer": "chacun l'a donné avec son cœur", "ideas": ["Faire le même petit cadeau pour chaque enfant : zéhé, et pourtant unique.", "Dire la bénédiction des kohanim aux enfants avant de dormir.", "Manger des anavim et compter les grains.", "Mesurer ses séar et deviner combien de temps pour qu'ils deviennent très longs."]}},
  {"id": "behaalotekha", "dir": "episodes/behaalotekha/", "book": "Bamidbar", "parasha": "Beha'alotekha", "title": "La prière la plus courte", "subtitle": "Les trompettes d'argent, le peuple fatigué du man, et la prière de cinq mots de Moshé pour guérir Myriam.", "art": "desert", "scenes": ["La yona revient", "Les 'hatsotsrot", "Les slav", "Myriam et la tfila", "On attend Myriam"], "sheet": {"words": [["חֲצוֹצְרוֹת", "'hatsotsrot", "les trompettes", "en argent, pour rassembler et partir"], ["שְׂלָו", "slav", "les cailles", "trop d'un coup"], ["תְּפִלָּה", "tfila", "la prière", "« El na, réfa na la »"], ["רְפוּאָה", "réfoua", "la guérison", "ce qu'on souhaite aux malades"], ["לְחַכּוֹת", "lé'hakot", "attendre", "tout le peuple attend Myriam"]], "also": "Révisés : <b>ménora</b>, <b>anan</b>, <b>man</b>, <b>lashon hara</b>, <b>tsara'at</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Aharon allume la ménora ; on fabrique deux trompettes d'argent ; le peuple part au signal de la nuée. Des gens se plaignent de la manne et réclament de la viande : arrivent les cailles. Myriam parle de Moshé, est atteinte de tsara'at, et Moshé prie en cinq mots : « El na, réfa na la ». Le peuple attend sept jours qu'elle revienne avant de repartir.", "question": "« Tout le peuple a attendu Myriam sept jours. Pour qui toi tu attendrais, même longtemps ? »", "answer": "pour quelqu'un qu'on aime", "ideas": ["Dire « El na, réfa na la » pour quelqu'un de malade.", "Fabriquer des 'hatsotsrot avec des rouleaux de papier.", "Jouer à attendre un membre de la famille avant de commencer le dîner.", "Souhaiter « réfoua shléma » à un copain malade."]}},
  {"id": "shelah", "dir": "episodes/shelah/", "book": "Bamidbar", "parasha": "Shla'h", "title": "La grappe géante", "subtitle": "Douze explorateurs rapportent une grappe géante ; dix ont peur, Kalev et Yéhoshoua ont du courage.", "art": "desert", "scenes": ["La yona revient", "Le voyage des méraglim", "L'eshkol géant", "Comme des 'hagavim", "Les tsitsit", "Retour au lit"], "sheet": {"words": [["מְרַגְּלִים", "méraglim", "les explorateurs", "douze, un par tribu"], ["אֶשְׁכּוֹל", "eshkol", "la grappe", "si grande qu'il faut deux hommes"], ["חֲגָבִים", "'hagavim", "les sauterelles", "« nous étions comme des sauterelles »"], ["אֹמֶץ", "omets", "le courage", "avoir peur et avancer quand même"], ["צִיצִית", "tsitsit", "les franges", "avec un fil bleu pour se souvenir"]], "also": "Révisés : <b>midbar</b>, <b>anavim</b>, <b>pa'had</b>, <b>man</b>, <b>anan</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Moshé envoie douze hommes explorer Canaan. Ils rapportent une énorme grappe, mais dix décrivent des géants et le peuple prend peur ; seuls Kalev et Yéhoshoua appellent à avoir confiance. Le peuple reste quarante ans dans le désert et ce sont les enfants qui entreront dans le pays. La paracha se termine par les tsitsit.", "question": "« Kalev avait peur, mais il a fait un pas, puis un autre. Qu'est-ce qui demande de l'omets pour toi en ce moment ? »", "answer": "un pas, puis un autre", "ideas": ["Manger du raisin et imaginer un eshkol géant.", "Compter les tsitsit de Papa ou du talith.", "Faire une chose difficile en disant « omets ! »", "Dessiner les douze méraglim avec leur grappe."]}},
  {"id": "korah", "dir": "episodes/korah/", "book": "Bamidbar", "parasha": "Kora'h", "title": "Le bâton qui fleurit", "subtitle": "Kora'h veut être chef à la place de Moshé, Moshé fait le premier pas pour la paix, et le bâton d'Aharon fleurit en une nuit.", "art": "desert", "scenes": ["La yona revient", "La ma'hloket", "Moshé fait le premier pas", "Les fils de Kora'h", "Les douze matot", "Le bâton fleuri"], "sheet": {"words": [["מַחְלֹקֶת", "ma'hloket", "la dispute", "comme un feu qui grandit"], ["קִנְאָה", "kin'a", "la jalousie", "Kora'h veut la place de Moshé"], ["פֶּרַח", "péra'h", "la fleur", "sur un bâton tout sec"], ["שָׁקֵד", "shaked", "l'amande", "le bâton d'Aharon en donne"], ["תְּהִלִּים", "Téhilim", "les psaumes", "écrits par les descendants de Kora'h"]], "also": "Révisés : <b>maté</b>, <b>kohen gadol</b>, <b>mishkan</b>, <b>shvatim</b>, <b>shalom</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Kora'h, cousin de Moshé, conteste son autorité et celle d'Aharon avec 250 hommes. Moshé va lui-même chez Datan et Aviram pour apaiser la dispute. Le groupe de Kora'h est englouti (dans l'épisode : « ils disparurent du camp », sans détail) ; ses fils, eux, survivent et leurs descendants composeront des psaumes. Le bâton d'Aharon fleurit et donne des amandes en une nuit.", "question": "« Une ma'hloket, c'est comme un feu : plus on souffle dessus, plus elle grandit. Comment on peut l'éteindre ? »", "answer": "faire le premier pas", "ideas": ["Manger des amandes et regarder un amandier en fleur en photo.", "Après une dispute, chacun dit une chose gentille sur l'autre.", "Chanter un psaume des fils de Kora'h (Téhilim 47, à Roch Hachana).", "Poser un bâton dans l'eau et dessiner les fleurs qu'il pourrait faire."]}},
  {"id": "houkat", "dir": "episodes/houkat/", "book": "Bamidbar", "parasha": "'Houkat", "title": "Le puits de Myriam", "subtitle": "Le puits de Myriam suivait le peuple ; quand il s'arrête, Moshé frappe le rocher au lieu de lui parler, puis tout le monde chante « Monte, puits ! ».", "art": "desert", "scenes": ["La yona revient", "Le puits de Myriam", "Parler au rocher", "La tristesse de Moshé", "Ali bé'èr", "Retour au lit"], "sheet": {"words": [["סֶלַע", "séla", "le rocher", "Moshé le frappe au lieu de lui parler"], ["לְדַבֵּר", "lédaber", "parler", "les mots doux sont plus forts que les coups"], ["צָמֵא", "tsamé", "avoir soif", "tout le peuple a soif"], ["שִׁיר", "shir", "le chant", "le chant du puits"], ["עֲלִי", "ali", "monte !", "« Ali bé'èr », monte, puits !"]], "also": "Révisés : <b>bé'èr</b>, <b>mayim</b>, <b>maté</b>, <b>midbar</b>, <b>tof</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Myriam meurt (une phrase douce dans l'épisode) et l'eau vient à manquer : selon les sages, le puits qui suivait le peuple était grâce à elle. Hachem dit à Moshé de parler au rocher ; en colère, Moshé le frappe, l'eau jaillit, mais il n'entrera pas en Israël. Plus loin, le peuple chante « Monte, puits ! ». (La vache rousse, la mort d'Aharon et le serpent d'airain sont laissés de côté.)", "question": "« Hachem voulait qu'on parle au rocher, pas qu'on le frappe. Pourquoi les mots doux marchent mieux que les coups ? »", "answer": "on obtient plus avec des mots doux", "ideas": ["Chanter « Ali bé'èr » en versant de l'eau dans un verre.", "Quand on est fâché, essayer de « lédaber » avant tout.", "Ramasser un séla en promenade et lui parler, pour rire.", "Raconter une chose qu'on aimait chez quelqu'un qui n'est plus là."]}},
  {"id": "balak", "dir": "episodes/balak/", "book": "Bamidbar", "parasha": "Balak", "title": "L'ânesse qui parle", "subtitle": "Le roi Balak veut qu'on maudisse Israël, l'ânesse de Bil'am voit un ange et se met à parler, et chaque malédiction devient une bénédiction.", "art": "desert", "scenes": ["La yona revient", "L'aton sur la route", "L'aton parle", "Les brakhot sur la montagne", "Retour au lit"], "sheet": {"words": [["אָתוֹן", "aton", "l'ânesse", "elle voit l'ange et parle"], ["קְלָלָה", "klala", "la malédiction", "Balak en voulait une"], ["פֶּה", "pé", "la bouche", "Hachem ouvre celle de l'ânesse"], ["אֹהָלִים", "ohalim", "les tentes", "bien rangées dans le camp"], ["מַה טֹּבוּ", "ma tovou", "qu'elles sont belles", "la prière du matin à la synagogue"]], "also": "Révisés : <b>malakh</b>, <b>brakha</b>, <b>ma'hané</b>, <b>har</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Balak, roi de Moav, paie le devin Bil'am pour maudire Israël. En route, son ânesse voit un ange qui barre le chemin et s'arrête trois fois ; Bil'am la frappe, l'ânesse parle, puis il voit l'ange. Sur trois montagnes, Bil'am veut maudire mais ne prononce que des bénédictions, dont « Ma tovou ohalekha Yaakov ».", "question": "« Bil'am voulait dire une klala et c'est une brakha qui est sortie. Toi, comment tu peux transformer des mots fâchés en mots gentils ? »", "answer": "des mots qui construisent", "ideas": ["Dire « Ma tovou » en entrant à la synagogue.", "Jouer à transformer une phrase fâchée en phrase gentille.", "Être doux avec les animaux de la maison ou du voisinage.", "Dessiner l'aton qui parle, avec une bulle."]}},
  {"id": "pinhas", "dir": "episodes/pinhas/", "book": "Bamidbar", "parasha": "Pin'has", "title": "Les cinq sœurs", "subtitle": "Cinq sœurs demandent avec courage la part de leur père, Hachem dit qu'elles ont raison, et Moshé pose les mains sur Yéhoshoua.", "art": "desert", "scenes": ["La yona revient", "Le partage du pays", "Les cinq a'hayot", "Hachem dit kén", "La smikha de Yéhoshoua"], "sheet": {"words": [["בָּנוֹת", "banot", "les filles", "les filles de Tselof'had"], ["אֲחָיוֹת", "a'hayot", "les sœurs", "elles sont cinq"], ["נַחֲלָה", "na'hala", "l'héritage", "la part de terre de la famille"], ["כֵּן", "kén", "oui", "« Elles ont raison »"], ["סְמִיכָה", "smikha", "l'imposition des mains", "Moshé la donne à Yéhoshoua"]], "also": "Révisés : <b>lispor</b>, <b>shvatim</b>, <b>tsédek</b>, <b>mishkan</b>, <b>shalom</b>, <b>toda</b>, <b>layla tov</b>.", "summary": "Pin'has reçoit une « alliance de paix ». Un nouveau recensement prépare le partage du pays. Les cinq filles de Tselof'had, Ma'hla, Noa, Hogla, Milka et Tirtsa, demandent la part de leur père mort sans fils ; Moshé consulte Hachem, qui leur donne raison et en fait une loi. Moshé demande un successeur et pose les mains sur Yéhoshoua. (L'épisode du zèle de Pin'has est laissé de côté.)", "question": "« Les filles de Tselof'had ont demandé ce qui était juste, poliment, toutes ensemble. Toi, qu'est-ce que tu trouves pas juste et que tu pourrais demander ? »", "answer": "avec respect, et ensemble", "ideas": ["Apprendre par cœur les noms des cinq a'hayot.", "Faire un vote en famille où chaque voix compte.", "Poser les mains sur la tête des enfants pour une brakha, comme la smikha.", "Dire « kén ! » chaque fois que quelqu'un a une bonne idée."]}},

const $ = id => document.getElementById(id);
const audio = $("audio");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const render = t => esc(t).replace(/\[\[([^|\]]*)\|([^|\]]*)\|[^\]]*\]\]/g,(m,he,tr)=>{
  if(!he) return tr;
  const g = GLOSS[tr] ? ` title="${esc(GLOSS[tr])}"` : "";
  return `<span class="w"${g}>${tr}<span class="he" lang="he">${he}</span></span>`;
});
const plain = t => t.replace(/\[\[[^|\]]*\|([^|\]]*)\|[^\]]*\]\]/g,"$1");
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;

// small per-device memory: last story, where we stopped, which stories were finished, theme
const store = {
  get(k,d){ try{ const v=localStorage.getItem("jt:"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("jt:"+k, JSON.stringify(v)); }catch(e){} }
};
let POS = store.get("pos",{}), DONE = new Set(store.get("done",[]));

let EP=null, EPI=-1, DATA=null, cues=[], dur=0, els=[], cur=-1, follow=true, phase=0, WEEK=-1, lastSave=0;

// ---------- theme ----------
const MOON='<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function applyTheme(t){
  if(t) document.documentElement.dataset.theme=t;
  const d=isDark();
  $("theme-ico").innerHTML = d?SUN:MOON;
