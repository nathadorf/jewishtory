$("theme").onclick=()=>{ const t=isDark()?"light":"dark"; store.set("theme",t); applyTheme(t); };

// ---------- story picker ----------
const BOOK_FR = {Bereshit:"La Genèse",Shemot:"L'Exode",Vayikra:"Le Lévitique",Bamidbar:"Les Nombres",Devarim:"Le Deutéronome"};
const BOOKS = [...new Set(EPISODES.map(e=>e.book))];
$("count-lbl").textContent = ` (${EPISODES.length})`;
function badges(i){
  const e=EPISODES[i], b=[];
  if(i===WEEK) b.push('<span class="pill">Cette semaine</span>');
  if(DONE.has(e.id)) b.push('<span class="pill soft">✓ Écoutée</span>');
  else if(POS[e.id]) b.push('<span class="pill soft">En cours</span>');
  return b.join("");
}
function buildPicker(){
  const openBook = EP ? EP.book : EPISODES[0].book;
  const books = BOOKS.map(b=>{
    const eps = EPISODES.map((e,i)=>[e,i]).filter(([e])=>e.book===b);
    return `<details class="book"${openBook===b?" open":""}><summary><b>${b}</b><span>${BOOK_FR[b]||""} · ${eps.length} ${eps.length>1?"parashiot":"parasha"}</span></summary><div class="episodes">${eps.map(([e,i])=>`<button class="ep" data-i="${i}" aria-current="${i===EPI}"><small>Paracha ${e.parasha}</small><b>${e.title}</b><span class="badges">${badges(i)}</span></button>`).join("")}</div></details>`;
  });
  if(!BOOKS.includes("Devarim")) books.push(`<div class="book soon"><b>Devarim</b><span>${BOOK_FR.Devarim} · bientôt</span></div>`);
  $("episodes").innerHTML = books.join("");
  $("episodes").querySelectorAll(".ep").forEach(b=>b.onclick=()=>{ $("picker").close(); load(+b.dataset.i, true); });
}
$("open-picker").onclick=()=>{
  buildPicker(); $("picker").showModal();
  const c=$("episodes").querySelector('.ep[aria-current="true"]'); if(c) c.scrollIntoView({block:"center"});
};
$("close-picker").onclick=()=>$("picker").close();
$("picker").addEventListener("click",e=>{ if(e.target===$("picker")) $("picker").close(); });

// ---------- this week's parasha (Hebcal), so the site opens on the right story ----------
const HEBCAL = {"Noach":"noah","Lech-Lecha":"lekh-lekha","Vayera":"vayera","Chayei Sara":"haye-sarah","Toldot":"toldot","Vayetzei":"vayetse","Vayishlach":"vayishlah","Vayeshev":"vayeshev","Miketz":"miketz","Vayigash":"vayigash","Vayechi":"vayehi",
  "Shemot":"shemot","Vaera":"vaera","Bo":"bo","Beshalach":"beshalah","Yitro":"yitro","Mishpatim":"mishpatim","Terumah":"terouma","Tetzaveh":"tetsave","Ki Tisa":"ki-tissa","Vayakhel":"vayakhel-pekoude","Pekudei":"vayakhel-pekoude","Vayakhel-Pekudei":"vayakhel-pekoude",
  "Vayikra":"vayikra","Tzav":"tsav","Shmini":"shemini","Tazria":"tazria-metsora","Metzora":"tazria-metsora","Tazria-Metzora":"tazria-metsora","Achrei Mot":"aharei-mot-kedoshim","Kedoshim":"aharei-mot-kedoshim","Achrei Mot-Kedoshim":"aharei-mot-kedoshim","Emor":"emor","Behar":"behar-behoukotai","Bechukotai":"behar-behoukotai","Behar-Bechukotai":"behar-behoukotai",
  "Bamidbar":"bamidbar","Nasso":"nasso","Beha'alotcha":"behaalotekha","Sh'lach":"shelah","Korach":"korah","Chukat":"houkat","Chukat-Balak":"houkat","Balak":"balak","Pinchas":"pinhas","Matot":"matot-masse","Masei":"matot-masse","Matot-Masei":"matot-masse"};
async function thisWeek(){
  const d=new Date(), iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
  const end=new Date(d); end.setDate(d.getDate()+13);
  let il=false; try{ il = Intl.DateTimeFormat().resolvedOptions().timeZone==="Asia/Jerusalem"; }catch(e){}
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),2500);
  try{
    const r=await fetch(`https://www.hebcal.com/hebcal?v=1&cfg=json&s=on&i=${il?"on":"off"}&start=${iso(d)}&end=${iso(end)}`,{signal:ctl.signal});
    const it=(await r.json()).items.find(x=>x.category==="parashat");
    if(!it) return -1;
    const id=HEBCAL[it.title.replace(/^Parashat /,"").replace(/’/g,"'")];
    return EPISODES.findIndex(e=>e.id===id);
  }catch(e){ return -1; } finally{ clearTimeout(to); }
}
function showWeek(){
  if(EP) $("eyebrow").innerHTML = `Histoire du soir · Paracha ${esc(EP.parasha)}`+(EPI===WEEK?' <span class="pill">Cette semaine</span>':"");
  const w=$("week");
  if(WEEK<0 || WEEK===EPI){ w.hidden=true; return; }
  const e=EPISODES[WEEK];
  w.innerHTML=`<p><span class="pill">Cette semaine</span> Paracha <b>${e.parasha}</b> : ${e.title}</p><button class="cta" id="go-week">Écouter</button>`;
  w.hidden=false; $("go-week").onclick=()=>{ load(WEEK,true); window.scrollTo({top:0,behavior:"smooth"}); };
}

// ---------- parent sheet ----------
function renderSheet(e){
  const s=e.sheet;
  $("sheet").innerHTML = `
    <div><p class="eyebrow">Fiche parent · Semaine de ${e.parasha}</p><h2>Les 5 mots de la semaine</h2></div>
    <div class="tw"><table><thead><tr><th>Hébreu</th><th>Se dit</th><th>En français</th><th>Dans l'histoire</th></tr></thead>
    <tbody>${s.words.map(w=>`<tr><td class="he" lang="he">${w[0]}</td><td><b>${w[1]}</b></td><td>${w[2]}</td><td>${w[3]}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">${s.also}</p>
    <div><h2>La paracha en bref</h2><p style="margin-top:.4em">${s.summary}</p></div>
    <div class="q"><p class="eyebrow">La question du soir</p><p><b>${s.question}</b></p></div>
    <div><h2>Pour aller plus loin, sans écran</h2><ul>${s.ideas.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
}

// ---------- loading a story ----------
function navBtn(btn,i){
  btn.disabled = i<0 || i>=EPISODES.length;
  if(!btn.disabled){ btn.querySelector("span").textContent = EPISODES[i].parasha; btn.setAttribute("aria-label",`${btn.id==="prev"?"Épisode précédent":"Épisode suivant"} : paracha ${EPISODES[i].parasha}`); btn.onclick=()=>load(i,false); }
}
async function load(i, autoplay){
  savePos(true);
  EPI=i; EP = EPISODES[i];
  store.set("last", EP.id);
  if(location.hash!=="#"+EP.id) history.replaceState(null,"","#"+EP.id);
  document.title = `${EP.title} · Jewishtory`;
  $("title").textContent = EP.title; $("subtitle").textContent = EP.subtitle;
  navBtn($("prev"),i-1); navBtn($("next"),i+1);
  showWeek(); renderSheet(EP);
  audio.pause(); audio.src = EP.dir + "story.mp3";
  cur=-1; phase=0; dur=0; setBar(0);
  $("who").textContent="Prêt pour l'histoire ?"; $("line").textContent="Appuie sur ▶";
  $("the-end").hidden=true; $("resume").hidden=true;
  $("story").innerHTML='<p class="note">Chargement de l\'histoire…</p>';
  mediaMeta();
  const want=EP;
  let data;
  try { data = await (await fetch(EP.dir + "cues.json")).json(); }
  catch(err){ $("story").innerHTML='<p class="note">Impossible de charger le texte de l\'histoire. Vérifie la connexion et recharge la page.</p>'; return; }
  if(want!==EP) return; // another story was picked meanwhile
  DATA=data; cues = DATA.cues; dur = DATA.duration;
  $("bar").setAttribute("aria-valuemax", Math.round(dur));
  $("time").textContent = `0:00 / ${fmt(dur)}`;
  const sp = [...new Set(cues.map(c=>c.sp))];
  $("cast").innerHTML = sp.map(k=>`<span class="who-chip"><span class="dot" style="background:var(--v-${k})"></span>${NAMES[k]}</span>`).join("");
  const st=$("story"); st.innerHTML=""; els=[];
  cues.forEach((c,j)=>{
    const si = DATA.scenes.indexOf(j);
    if(si>=0 && EP.scenes[si]){ const h=document.createElement("h3"); h.className="scene"; h.textContent=EP.scenes[si]; st.appendChild(h); }
    const d=document.createElement("div"); d.className="cue"; d.style.borderLeftColor=`var(--v-${c.sp})`;
    d.innerHTML=`<span class="sp" style="color:var(--v-${c.sp})">${NAMES[c.sp]}</span>${render(c.text)}`;
    d.onclick=()=>{audio.currentTime=c.start+0.01; audio.play();};
    st.appendChild(d); els.push(d);
  });
  $("bar").querySelectorAll(".mark").forEach(m=>m.remove());
  DATA.scenes.slice(1).forEach(j=>{const m=document.createElement("div");m.className="mark";m.style.left=(cues[j].start/dur*100)+"%";$("bar").appendChild(m);});
  // pick up where we stopped last time
  const p=POS[EP.id];
  if(p && p>10 && p<dur-15){
    if(audio.readyState>=1) audio.currentTime=p; else audio.addEventListener("loadedmetadata",()=>{ if(EP===want) audio.currentTime=p; },{once:true});
    phase=p; setBar(p); $("time").textContent=`${fmt(p)} / ${fmt(dur)}`;
    $("resume").innerHTML=`Reprise à ${fmt(p)} · <button class="linkish" id="restart">Recommencer au début</button>`;
    $("resume").hidden=false;
    $("restart").onclick=()=>{ audio.currentTime=0; phase=0; $("resume").hidden=true; tick(); audio.play().catch(()=>{}); };
  }
  if(autoplay) audio.play().catch(()=>{});
}

// ---------- player ----------
function setBar(t){
  const p = dur ? Math.min(100,t/dur*100) : 0;
  $("fill").style.width=p+"%"; $("knob").style.left=p+"%";
  $("bar").setAttribute("aria-valuenow",Math.round(t)); $("bar").setAttribute("aria-valuetext",`${fmt(t)} sur ${fmt(dur)}`);
}
function savePos(force){
  if(!EP || !dur) return;
  const now=Date.now(); if(!force && now-lastSave<4000) return; lastSave=now;
  const t=audio.currentTime;
  if(t>10 && t<dur-15) POS[EP.id]=Math.round(t); else if(t>=dur-15) delete POS[EP.id];
  store.set("pos",POS);
}
function tick(){
  if(!dur) return;
  const t=audio.currentTime;
  setBar(t);
  $("time").textContent=`${fmt(t)} / ${fmt(dur)}`;
  let k=-1; for(let i=0;i<cues.length;i++){ if(cues[i].start<=t+0.05) k=i; else break; }
  if(k!==cur){
    if(cur>=0 && els[cur]) els[cur].classList.remove("active");
    cur=k;
    if(k>=0){ els[k].classList.add("active"); $("who").textContent=NAMES[cues[k].sp]; $("line").textContent=plain(cues[k].text);
      if(follow && !audio.paused) els[k].scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"}); }
  }
  phase=t;
  if(!audio.paused) savePos(false);
}
audio.addEventListener("timeupdate",tick);
audio.addEventListener("play",()=>{$("ico").innerHTML='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';$("play").setAttribute("aria-label","Pause");$("resume").hidden=true;if(cur<0){$("who").textContent=NAMES.N;$("line").textContent="Ça commence…";}});
audio.addEventListener("pause",()=>{$("ico").innerHTML='<path d="M7 4l14 8-14 8z"/>';$("play").setAttribute("aria-label","Écouter l'histoire");savePos(true);});
audio.addEventListener("ended",()=>{
  DONE.add(EP.id); store.set("done",[...DONE]); delete POS[EP.id]; store.set("pos",POS);
  const n=EPI+1<EPISODES.length?EPISODES[EPI+1]:null;
  $("the-end").innerHTML=`<p style="margin:0;font-family:var(--f-display);font-size:1.3rem;color:var(--ink)">Layla tov ! Fin de l'histoire.</p>`+
    (n?`<button class="cta" id="next-ep">Histoire suivante : ${n.parasha}</button>`:"");
  $("the-end").hidden=false;
  if(n) $("next-ep").onclick=()=>{ load(EPI+1,true); window.scrollTo({top:0,behavior:"smooth"}); };
});
audio.addEventListener("loadedmetadata",()=>{audio.playbackRate=$("slow").getAttribute("aria-pressed")==="true"?0.85:1;});
window.addEventListener("pagehide",()=>savePos(true));
document.addEventListener("visibilitychange",()=>{ if(document.hidden) savePos(true); });

const seek=t=>{ if(!dur) return; audio.currentTime=Math.max(0,Math.min(dur,t)); tick(); };
const toggle=()=>audio.paused?audio.play().catch(()=>{}):audio.pause();
$("play").onclick=toggle;
$("back").onclick=()=>seek(audio.currentTime-15);
$("fwd").onclick=()=>seek(audio.currentTime+15);
$("slow").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",on);audio.playbackRate=on?0.85:1;};
$("follow").onclick=e=>{follow=!follow;e.currentTarget.setAttribute("aria-pressed",follow);};
// scrub by tap or drag
const bar=$("bar"); let dragging=false;
const atX=x=>{const r=bar.getBoundingClientRect(); return Math.max(0,Math.min(1,(x-r.left)/r.width))*dur;};
bar.addEventListener("pointerdown",e=>{ if(!dur) return; dragging=true; bar.setPointerCapture(e.pointerId); seek(atX(e.clientX)); });
bar.addEventListener("pointermove",e=>{ if(dragging) seek(atX(e.clientX)); });
bar.addEventListener("pointerup",()=>dragging=false);
bar.addEventListener("pointercancel",()=>dragging=false);
bar.addEventListener("keydown",e=>{
  const m={ArrowLeft:-5,ArrowDown:-5,ArrowRight:5,ArrowUp:5,PageDown:-30,PageUp:30}[e.key];
  if(m){ seek(audio.currentTime+m); e.preventDefault(); }
  else if(e.key==="Home"){ seek(0); e.preventDefault(); } else if(e.key==="End"){ seek(dur-1); e.preventDefault(); }
});
// space bar plays / pauses when nothing else has focus
document.addEventListener("keydown",e=>{
  if(e.key!==" " || $("picker").open) return;
  const t=e.target; if(t.closest && t.closest("button,a,input,textarea,summary,[role=slider]")) return;
  e.preventDefault(); toggle();
});

// lock-screen / headphone controls on phones
function mediaMeta(){
  if(!("mediaSession" in navigator) || !EP) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({title:EP.title, artist:`Paracha ${EP.parasha}`, album:"Jewishtory", artwork:[{src:"apple-touch-icon.png",sizes:"180x180",type:"image/png"}]});
  }catch(e){}
}
if("mediaSession" in navigator){
  const h={play:()=>audio.play(),pause:()=>audio.pause(),seekbackward:()=>seek(audio.currentTime-15),seekforward:()=>seek(audio.currentTime+15),
    seekto:d=>seek(d.seekTime),previoustrack:()=>EPI>0&&load(EPI-1,true),nexttrack:()=>EPI<EPISODES.length-1&&load(EPI+1,true)};
  for(const k in h){ try{ navigator.mediaSession.setActionHandler(k,h[k]); }catch(e){} }
}

function tab(which){
  const s = which==="sheet";
  $("t-story").setAttribute("aria-selected",!s); $("t-sheet").setAttribute("aria-selected",s);
  $("p-story").style.display = s ? "none" : "flex"; $("p-sheet").hidden = !s;
}
$("t-story").onclick=()=>tab("story"); $("t-sheet").onclick=()=>tab("sheet");
window.addEventListener("hashchange",()=>{ const i=EPISODES.findIndex(e=>location.hash==="#"+e.id); if(i>=0 && i!==EPI) load(i,false); });

// ---------- which story to open ----------
(async()=>{
  const byId=id=>EPISODES.findIndex(e=>e.id===id);
  const fromHash=byId(location.hash.slice(1));
  const last=byId(store.get("last",""));
  const lastInProgress = last>=0 && POS[EPISODES[last].id] ? last : -1;
  const quick = fromHash>=0 ? fromHash : lastInProgress;
  if(quick>=0){ load(quick,false); WEEK=await thisWeek(); showWeek(); return; }
  WEEK=await thisWeek();
  load(WEEK>=0 ? WEEK : (last>=0 ? last : 0), false);
})();

// illustrations, drawn per scene
const cv=$("scene"), cx=cv.getContext("2d"), W=cv.width, H=cv.height;
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
const drops=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,v:6+Math.random()*6}));
const stars=Array.from({length:140},()=>({x:Math.random()*W,y:Math.random()*H*0.6,r:Math.random()*2+0.5}));
function sceneAt(t){ let s=0; if(DATA) DATA.scenes.forEach((ci,i)=>{ if(t>=cues[ci].start-0.5) s=i; }); return s; }
function sky(top,bottom){ const g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,top); g.addColorStop(1,bottom); cx.fillStyle=g; cx.fillRect(0,0,W,H); }
function starfield(ts,n){ cx.fillStyle="#fff7d6"; stars.slice(0,n).forEach(st=>{cx.globalAlpha=0.5+0.5*Math.sin(ts/700+st.x);cx.beginPath();cx.arc(st.x,st.y,st.r,0,7);cx.fill();}); cx.globalAlpha=1; }
function dove(x,y,ts){ cx.fillStyle="#ffffff"; cx.beginPath(); cx.ellipse(x,y,16,9,0,0,7); cx.fill(); cx.beginPath(); cx.moveTo(x-10,y-2); cx.lineTo(x-24,y-22+Math.sin(ts/120)*8); cx.lineTo(x+6,y-4); cx.fill(); }
function drawArk(ts){
  const s=sceneAt(phase), storm=(s===2), rainbow=(s>=4), night=(s===5||s===0);
  if(storm) sky("#3b4057","#5d6680"); else if(night) sky("#1c1a45","#3a3f7a"); else sky("#9fc6ee","#e8f1fb");
  if(night){ starfield(ts,40); cx.fillStyle="#fff7d6"; cx.beginPath(); cx.arc(W*0.85,H*0.2,34,0,7); cx.fill(); }
  if(rainbow){ ["#e8504a","#f29a38","#f2d23c","#5cbf6a","#4a8fe0","#8a5bd6"].forEach((c,i)=>{cx.strokeStyle=c;cx.globalAlpha=night?0.45:0.85;cx.lineWidth=14;cx.beginPath();cx.arc(W*0.5,H*1.02,H*0.82-i*14,Math.PI,2*Math.PI);cx.stroke();}); cx.globalAlpha=1; }
  const t=reduce?0:ts/900;
  for(let k=0;k<3;k++){
    cx.fillStyle=["#2f5d8a","#3f78ad","#5795c9"][k]; cx.beginPath(); cx.moveTo(0,H);
    const base=H*(0.66+k*0.1);
    for(let x=0;x<=W;x+=20) cx.lineTo(x, base+Math.sin(x/70+t*(1+k*0.3)+k)*(storm?12:6));
    cx.lineTo(W,H); cx.fill();
    if(k===0){
      const ay=base-6+Math.sin(t)*(storm?8:3), rock=Math.sin(t*0.9)*(storm?0.06:0.02);
      cx.save(); cx.translate(W*0.5,ay); cx.rotate(rock);
      cx.fillStyle="#8a5a33"; cx.beginPath(); cx.moveTo(-210,-40); cx.lineTo(210,-40); cx.quadraticCurveTo(190,40,0,46); cx.quadraticCurveTo(-190,40,-210,-40); cx.fill();
      cx.fillStyle="#a8743f"; cx.fillRect(-120,-110,240,72);
      cx.fillStyle="#6e4524"; cx.beginPath(); cx.moveTo(-140,-110); cx.lineTo(0,-160); cx.lineTo(140,-110); cx.fill();
      cx.fillStyle="#ffe7a8"; for(let i=-2;i<=2;i++){ cx.beginPath(); cx.arc(i*44,-75,11,0,7); cx.fill(); }
      cx.fillStyle="#cfa274"; cx.beginPath(); cx.moveTo(-50,-160); cx.quadraticCurveTo(-48,-200,-30,-206); cx.lineTo(-24,-150); cx.fill();
      cx.beginPath(); cx.ellipse(-26,-208,12,8,0.3,0,7); cx.fill();
      if(s>=3) dove(120+Math.sin(ts/600)*30,-200+Math.cos(ts/400)*6,ts);
      cx.restore();
    }
  }
  if(storm || s===0){ cx.strokeStyle="rgba(230,240,255,.55)"; cx.lineWidth=2;
    drops.forEach(d=>{cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x-3,d.y+14);cx.stroke(); if(!reduce){d.y+=d.v*(storm?1.4:0.8); if(d.y>H){d.y=-20;d.x=Math.random()*W;}}}); }
}
function camel(x,y,sc,ts,bob){
  cx.save(); cx.translate(x,y+(reduce?0:Math.sin(ts/300+bob)*2)); cx.scale(sc,sc);
  cx.fillStyle="#b9844d";
  cx.beginPath(); cx.ellipse(0,-60,60,28,0,0,7); cx.fill();                       // body
  cx.beginPath(); cx.ellipse(-8,-88,24,20,0,Math.PI,2*Math.PI); cx.fill();         // hump
  cx.fillRect(-45,-45,10,50); cx.fillRect(-25,-45,10,50); cx.fillRect(25,-45,10,50); cx.fillRect(40,-45,10,50); // legs
  cx.beginPath(); cx.moveTo(50,-70); cx.quadraticCurveTo(80,-90,78,-125); cx.lineTo(92,-125); cx.quadraticCurveTo(96,-85,62,-55); cx.fill(); // neck
  cx.beginPath(); cx.ellipse(94,-128,18,10,0.2,0,7); cx.fill();                    // head
  cx.restore();
}
function drawDesert(ts){
  const s=sceneAt(phase), night=(s>=4 || s===0 && phase<12), sunset=(s===3);
  if(night) sky("#141238","#3b3470"); else if(sunset) sky("#f2994a","#f7d08a"); else sky("#8fc3ea","#f6e3b4");
  if(night){ starfield(ts, s===4?140:70); }
  else { cx.fillStyle=sunset?"#fff1c9":"#fff4c2"; cx.beginPath(); cx.arc(W*(sunset?0.78:0.82),H*(sunset?0.5:0.2),sunset?46:38,0,7); cx.fill(); }
  // dunes
  [["#d9a85f",0.62,0.7],["#e7bb72",0.72,1.1],["#f0cc88",0.84,1.5]].forEach(([c,b,f],k)=>{
    cx.fillStyle=night?["#4b3f6b","#5a4c7a","#6a5a88"][k]:c; cx.beginPath(); cx.moveTo(0,H);
    for(let x=0;x<=W;x+=16) cx.lineTo(x,H*b+Math.sin(x/(160*f)+k*2)*18*f);
    cx.lineTo(W,H); cx.fill();
  });
  // tent from the evening on
  if(s>=3){ cx.fillStyle=night?"#6b4a3a":"#7a4f35"; cx.beginPath(); cx.moveTo(W*0.62,H*0.84); cx.lineTo(W*0.72,H*0.58); cx.lineTo(W*0.84,H*0.84); cx.fill();
    cx.fillStyle="#ffcf7a"; cx.globalAlpha=night?0.9:0.6; cx.beginPath(); cx.moveTo(W*0.70,H*0.84); cx.lineTo(W*0.72,H*0.68); cx.lineTo(W*0.75,H*0.84); cx.fill(); cx.globalAlpha=1; }
  // caravan walks during the day scenes
  if(s>=1 && s<=3){ const off=reduce?0:(ts/40)%W; for(let i=0;i<3;i++) camel(((W*0.15+i*170+(s===3?0:off))%(W+200))-100, H*0.86, 0.9-i*0.12, ts, i); }
  if(s>=4){ camel(W*0.38,H*0.9,0.8,0,0); }
  if(s===0 || s===5) dove(W*0.25+Math.sin(ts/600)*40,H*0.3+Math.cos(ts/400)*8,ts);
}
function drawTent(ts){
  const s=sceneAt(phase), night=(s===0||s===5), dusk=(s===3);
  if(night) sky("#141238","#3b3470"); else if(dusk) sky("#f2994a","#f7d08a"); else sky("#8fc3ea","#f6e3b4");
  if(night) starfield(ts,90);
  else { cx.fillStyle="#fff4c2"; cx.beginPath(); cx.arc(W*0.85,H*(dusk?0.45:0.18),dusk?44:36,0,7); cx.fill(); }
  if(s===4){ // the mountain
    cx.fillStyle="#b07a52"; cx.beginPath(); cx.moveTo(W*0.15,H); cx.lineTo(W*0.5,H*0.22); cx.lineTo(W*0.88,H); cx.fill();
    cx.fillStyle="#c99467"; cx.beginPath(); cx.moveTo(W*0.5,H*0.22); cx.lineTo(W*0.62,H*0.48); cx.lineTo(W*0.55,H*0.44); cx.lineTo(W*0.5,H*0.5); cx.lineTo(W*0.44,H*0.42); cx.lineTo(W*0.38,H*0.48); cx.fill();
    cx.fillStyle="#5e8a4a"; cx.beginPath(); cx.arc(W*0.57,H*0.3,14,0,7); cx.fill();
    cx.strokeStyle="#e9e2cf"; cx.lineWidth=4; cx.beginPath(); cx.arc(W*0.565,H*0.29,6,0,6); cx.stroke(); // ram's horn
    const g=0.35+0.25*Math.sin(reduce?0:ts/500); cx.fillStyle=`rgba(255,240,180,${g})`; cx.beginPath(); cx.arc(W*0.5,H*0.12,40,0,7); cx.fill();
    return;
  }
  [["#d9a85f",0.66,0.8],["#f0cc88",0.82,1.4]].forEach(([c,b,f],k)=>{
    cx.fillStyle=night?["#4b3f6b","#6a5a88"][k]:c; cx.beginPath(); cx.moveTo(0,H);
    for(let x=0;x<=W;x+=16) cx.lineTo(x,H*b+Math.sin(x/(160*f)+k*2)*16*f);
    cx.lineTo(W,H); cx.fill();
  });
  // oak tree
  cx.fillStyle=night?"#3a2e44":"#6e4a2c"; cx.fillRect(W*0.2,H*0.5,18,H*0.32);
  cx.fillStyle=night?"#2f4a3e":"#4f7f3e"; [[0,0,60],[-40,20,44],[40,22,46]].forEach(([dx,dy,r])=>{cx.beginPath();cx.arc(W*0.2+9+dx,H*0.46+dy,r,0,7);cx.fill();});
  // tent, open on every side
  cx.fillStyle=night?"#6b4a3a":"#7a4f35"; cx.beginPath(); cx.moveTo(W*0.5,H*0.86); cx.lineTo(W*0.64,H*0.5); cx.lineTo(W*0.8,H*0.86); cx.fill();
  cx.fillStyle="#ffcf7a"; cx.globalAlpha=night?0.9:0.55; cx.beginPath(); cx.moveTo(W*0.6,H*0.86); cx.lineTo(W*0.64,H*0.62); cx.lineTo(W*0.69,H*0.86); cx.fill(); cx.globalAlpha=1;
  if(s===1){ // three shining travellers on the road
    const off=reduce?0:Math.min(ts/60%160,160);
    for(let i=0;i<3;i++){ const x=W*0.95-off-i*40, y=H*0.8;
      cx.fillStyle="rgba(255,240,180,.35)"; cx.beginPath(); cx.arc(x,y-30,26,0,7); cx.fill();
      cx.fillStyle="#f3ead6"; cx.fillRect(x-8,y-30,16,34); cx.beginPath(); cx.arc(x,y-38,8,0,7); cx.fill(); }
  }
  if(s===3){ // little cradle with a laughing baby
    cx.fillStyle="#caa27a"; cx.beginPath(); cx.ellipse(W*0.42,H*0.84,34,12,0,0,Math.PI); cx.fill();
    cx.fillStyle="#f5d3b5"; cx.beginPath(); cx.arc(W*0.42,H*0.8,10,0,7); cx.fill(); }
  if(s===0 || s===5) dove(W*0.3+Math.sin(ts/600)*40,H*0.25+Math.cos(ts/400)*8,ts);
}
function draw(ts){ if(EP && EP.art==="desert") drawDesert(ts); else if(EP && EP.art==="tent") drawTent(ts); else drawArk(ts); requestAnimationFrame(draw); }
requestAnimationFrame(draw);
</script>
